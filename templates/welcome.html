<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesPulse</title><link rel="icon" type="image/svg+xml" href="/static/salespulse-mark.svg"><style>*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#202228;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif;overflow:hidden}.stage{height:100vh;display:grid;place-items:center;position:relative}.glow{position:absolute;width:380px;height:380px;border-radius:50%;background:radial-gradient(circle,rgba(231,122,67,.12),transparent 68%);animation:breath 2.6s ease-in-out infinite}.box{text-align:center;position:relative;z-index:2;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}.logo{width:min(320px,72vw);margin-bottom:20px;animation:logoIn 1.1s .1s cubic-bezier(.2,.8,.2,1) both}.name{font-size:12px;letter-spacing:3px;font-weight:800;color:#8e939a;animation:fade 1s .55s both}.line{height:2px;width:0;background:#22252b;margin:19px auto 0;animation:line 1s 1s ease forwards}@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}@keyframes logoIn{from{opacity:0;transform:scale(.88);filter:blur(7px)}to{opacity:1;transform:none;filter:none}}@keyframes fade{from{opacity:0}to{opacity:1}}@keyframes line{to{width:95px}}@keyframes breath{50%{transform:scale(1.08);opacity:.75}}
</style></head><body><div class="stage"><div class="glow"></div><div class="box"><img class="logo" src="/static/salespulse-logo-dark.svg" alt="SalesPulse"><div class="name">DATA INTELLIGENCE WORKSPACE</div><div class="line"></div></div></div><script>setTimeout(()=>location.href='/app/overview',2100)</script></body></html>
