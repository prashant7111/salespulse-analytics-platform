<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesPulse — Sign in</title><link rel="icon" type="image/svg+xml" href="/static/salespulse-mark.svg"><style>
*{box-sizing:border-box}body{margin:0;background:#f6f6f3;color:#24272d;font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.wrap{min-height:100vh;display:grid;place-items:center;padding:24px}.shell{width:min(980px,100%);display:grid;grid-template-columns:1.08fr .92fr;background:#fff;border:1px solid #e3e3de;border-radius:24px;overflow:hidden;box-shadow:0 24px 70px rgba(35,38,43,.08)}.pitch{padding:54px;background:#fafaf8;border-right:1px solid #ecece7}.logo{width:220px;display:block}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.6px;color:#999eA5;margin-top:42px}.pitch h1{font-size:48px;line-height:1.03;letter-spacing:-2.5px;margin:9px 0 16px}.pitch p{color:#737b87;line-height:1.7;max-width:470px}.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}.chip{font-size:11px;border:1px solid #e1e1dc;border-radius:999px;padding:8px 10px;background:#fff}.card{padding:42px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:3px;background:#f1f1ee;padding:4px;border-radius:11px}.tabs button{border:0;background:transparent;padding:11px;border-radius:8px;font:inherit;font-size:13px;cursor:pointer}.tabs button.active{background:#fff;box-shadow:0 4px 15px rgba(35,38,43,.08);font-weight:800}.form{margin-top:24px}.field{margin:14px 0}.field label{display:block;font-size:10px;font-weight:800;color:#777e87;margin-bottom:6px}.field input{width:100%;padding:12px;border:1px solid #deded9;border-radius:10px;background:#fff;outline:none;font:inherit;font-size:13px}.field input:focus{border-color:#c6c6bf;box-shadow:0 0 0 3px rgba(231,119,60,.08)}.submit{width:100%;padding:13px;border:0;border-radius:10px;background:#24272d;color:#fff;font-weight:800;cursor:pointer;margin-top:6px}.submit:hover{background:#30343b}.msg{min-height:17px;font-size:12px;color:#b45c45;margin-top:10px}.demo{margin-top:17px;padding:13px;background:#f4f4f1;border-radius:11px;color:#737b87;font-size:11px;line-height:1.6}.demo b{color:#30343b}@media(max-width:760px){.shell{grid-template-columns:1fr}.pitch{display:none}.card{padding:30px}}
</style></head><body><div class="wrap"><div class="shell"><section class="pitch"><img class="logo" src="/static/salespulse-logo-dark.svg" alt="SalesPulse"><div class="eyebrow">DATA WORKSPACE</div><h1>Bring data.<br>Make sense of it.</h1><p>Upload a structured dataset, check its quality, and turn the fields that matter into clear, interactive analysis.</p><div class="chips"><span class="chip">CSV / Excel</span><span class="chip">JSON / Parquet</span><span class="chip">Automatic profiling</span><span class="chip">Live sources</span></div></section><section class="card"><div class="tabs"><button id="loginTab" class="active" onclick="mode('login')">Sign in</button><button id="regTab" onclick="mode('register')">Create account</button></div><form class="form" onsubmit="submitForm(event)"><div id="nameField" class="field" style="display:none"><label>FULL NAME</label><input id="name" autocomplete="name"></div><div class="field"><label>EMAIL</label><input id="email" type="email" autocomplete="email" required placeholder="you@company.com"></div><div class="field"><label>PASSWORD</label><input id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="At least 6 characters"></div><button class="submit" id="submit">Sign in</button><div class="msg" id="msg"></div></form><div class="demo"><b>Demo account</b><br>demo@salespulse.local · salespulse</div></section></div></div><script>
let currentMode='login';const $=id=>document.getElementById(id);function mode(x){currentMode=x;$('loginTab').classList.toggle('active',x==='login');$('regTab').classList.toggle('active',x==='register');$('nameField').style.display=x==='register'?'block':'none';$('name').required=x==='register';$('password').autocomplete=x==='register'?'new-password':'current-password';$('submit').textContent=x==='register'?'Create account':'Sign in';$('msg').textContent=''}async function submitForm(e){e.preventDefault();$('msg').textContent='';const payload={email:$('email').value.trim(),password:$('password').value};if(currentMode==='register')payload.name=$('name').value.trim();try{const r=await fetch('/api/auth/'+currentMode,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});const j=await r.json();if(j.ok)location.href=j.redirect||'/app/welcome';else $('msg').textContent=j.message||'Please check the details and try again.'}catch(err){$('msg').textContent='SalesPulse is not reachable. Please start the application again.'}}</script></body></html>
