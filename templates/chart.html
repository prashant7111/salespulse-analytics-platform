<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SalesPulse — {{ chart_title }}</title><link rel="icon" type="image/svg+xml" href="/static/salespulse-mark.svg"><script src="https://cdn.jsdelivr.net/npm/echarts@6.1.0/dist/echarts.min.js"></script>
<style>
:root{--ink:#191b1f;--muted:#747a83;--line:#e7e7e2;--paper:#fff;--canvas:#f4f4f1;--shadow:0 18px 50px rgba(25,27,31,.055);--orange:#e57a43;--green:#2e7d5b;--purple:#7566a9;--red:#c45f5f;--gold:#b78d37;--teal:#4c8790}*{box-sizing:border-box}body{margin:0;background:var(--canvas);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 38px;position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:13px}.brand img{width:178px}.back{font-size:12px;text-decoration:none;color:#666d75;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px}.wrap{max-width:1450px;margin:auto;padding:38px}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.7px;color:#999ea5}.hero{display:flex;justify-content:space-between;gap:25px;align-items:flex-end;margin-bottom:20px}.hero h1{font-size:40px;letter-spacing:-2px;margin:7px 0 10px}.hero p{color:var(--muted);font-size:14px;line-height:1.65;max-width:850px;margin:0}.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow);animation:in .4s ease both}.chart{height:560px}.grid{display:grid;grid-template-columns:1.5fr .7fr;gap:16px;margin-top:16px}.mini{padding:18px;background:#fafaf8;border:1px solid var(--line);border-radius:13px}.mini b{display:block;font-size:23px;margin-bottom:5px}.mini span{font-size:10px;color:#8f949b}.insight{font-size:12px;color:#60656c;line-height:1.65}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:13px}.table{width:100%;border-collapse:collapse;font-size:11px;background:#fff}.table th,.table td{padding:10px 12px;text-align:left;border-bottom:1px solid #efefeb}.table th{background:#fafaf8;color:#777d85;font-size:10px}.table tr:last-child td{border-bottom:0}.empty{height:100%;display:grid;place-items:center;color:#969ba2;text-align:center;font-size:12px;padding:40px}@keyframes in{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:none}}@media(max-width:800px){.top{padding:0 18px}.brand img{width:150px}.wrap{padding:24px 16px}.hero{display:block}.hero h1{font-size:32px}.hero .back{display:inline-block;margin-top:18px}.grid{grid-template-columns:1fr}.chart{height:430px}}
</style></head><body>
<header class="top"><div class="brand"><img src="/static/salespulse-logo-dark.svg" alt="SalesPulse"></div><a class="back" href="/app/intelligence">← Back to analysis</a></header>
<main class="wrap"><div class="hero"><div><div class="eyebrow">DETAILED VIEW</div><h1>{{ chart_title }}</h1><p id="description">Loading the analysis from your current dataset.</p></div></div>
<div class="card"><div id="chart" class="chart"></div></div>
<div class="grid"><div class="card"><div class="eyebrow">WHAT THIS SHOWS</div><h2 id="summaryTitle" style="font-size:17px;margin:7px 0 9px">Analysis</h2><p id="summary" class="insight">—</p></div><div class="card"><div class="eyebrow">SOURCE FIELD</div><div class="mini" style="margin-top:10px"><b id="field">—</b><span id="metric">—</span></div></div></div>
<div class="card" style="margin-top:16px"><div class="eyebrow">RANKING / VALUES</div><div class="table-wrap" style="margin-top:12px"><table class="table"><thead><tr><th>#</th><th>Label</th><th>Value</th><th>Share of shown values</th></tr></thead><tbody id="rows"></tbody></table></div></div>
</main><script>
const chartName={{ chart_name|tojson }};const dataKey={{ data_key|tojson }};const palette=['#e57a43','#2e7d5b','#7566a9','#b78d37','#c45f5f','#4c8790','#8b7355','#a56a94'];
function money(v){v=Number(v||0);return Math.abs(v)>=1e9?(v/1e9).toFixed(2)+'B':Math.abs(v)>=1e6?(v/1e6).toFixed(2)+'M':Math.abs(v)>=1e3?(v/1e3).toFixed(1)+'K':new Intl.NumberFormat('en-US',{maximumFractionDigits:0}).format(v)}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function draw(d){const el=document.getElementById('chart');if(!d.values?.length){el.innerHTML='<div class="empty">This dataset does not contain the fields needed for this analysis.</div>';document.getElementById('summary').textContent='SalesPulse did not invent a chart because the required field is not available.';return}const c=echarts.init(el);let opt={color:palette,animationDuration:1000,tooltip:{trigger:'axis',axisPointer:{type:'shadow'}},grid:{left:125,right:30,top:25,bottom:50},xAxis:{type:'value',axisLabel:{formatter:v=>money(v)}},yAxis:{type:'category',data:d.values.map(x=>x.label).reverse(),axisLabel:{width:115,overflow:'truncate'}},series:[{type:'bar',data:d.values.map(x=>x.value).reverse(),barMaxWidth:32,itemStyle:{borderRadius:[0,7,7,0]}}]};if(chartName==='trend'){opt={color:[palette[1]],animationDuration:1000,tooltip:{trigger:'axis',formatter:p=>p[0].axisValue+'<br><b>'+money(p[0].value)+'</b>'},grid:{left:65,right:25,top:25,bottom:55},xAxis:{type:'category',data:d.values.map(x=>x.label)},yAxis:{type:'value',axisLabel:{formatter:v=>money(v)}},series:[{type:'line',smooth:.25,data:d.values.map(x=>x.value),symbol:'circle',symbolSize:7,lineStyle:{width:3},areaStyle:{opacity:.08}}]};}if(chartName==='category'||chartName==='segment'){opt={color:palette,animationDuration:1000,tooltip:{trigger:'item',formatter:p=>p.name+'<br><b>'+money(p.value)+'</b> ('+p.percent+'%)'},legend:{bottom:0,type:'scroll'},series:[{type:'pie',radius:['42%','70%'],data:d.values.map(x=>({name:x.label,value:x.value})),label:{formatter:'{b}\n{d}%'}}]}}c.setOption(opt);window.addEventListener('resize',()=>c.resize());}
fetch('/api/chart/'+chartName).then(r=>r.json()).then(d=>{if(!d.ok){document.getElementById('description').textContent=d.message;return}draw(d);const vals=d.values||[];const total=vals.reduce((a,x)=>a+Number(x.value||0),0);document.getElementById('field').textContent=(d.fieldMap&&d.fieldMap[dataKey==='monthly'?'date':dataKey==='customers'?'customer':dataKey==='products'?'product':dataKey])||'Detected automatically';document.getElementById('metric').textContent='Measure: '+d.metric;document.getElementById('description').textContent='This view is calculated from the current source and uses only fields SalesPulse identified as suitable for the analysis.';document.getElementById('summary').textContent=chartName==='trend'?'Each point represents the aggregated measure for a reporting period. A time series is shown only when a recognizable date field exists.':`The chart ranks the available values by ${d.metric}. The detailed table below makes the ranking and relative contribution easy to verify.`;document.getElementById('rows').innerHTML=vals.map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.label)}</td><td>${money(x.value)}</td><td>${total?((Number(x.value)/total)*100).toFixed(1):'0.0'}%</td></tr>`).join('')}).catch(()=>document.getElementById('description').textContent='SalesPulse could not load this analysis. Return to the workspace and try again.');
</script></body></html>
